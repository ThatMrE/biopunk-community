# Netlify config for the Biopunk News review deploy.
#
# Scoped to this directory on purpose: the repo root is its own Netlify site
# (the biopunk.community landing page) and must keep its own settings.

[build]
  publish = "public"
  command = "echo 'no build step — server-rendered at request time'"

[build.environment]
  # node:sqlite needs Node 22.5 or newer.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/**", "src/**"]

# Serve the stylesheet, client script and icons straight from the CDN.
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# Everything else is rendered by the app.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
